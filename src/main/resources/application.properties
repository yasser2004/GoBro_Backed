spring.application.name=gobro-backend
server.port=${PORT:8085}
# Multipart uploads (the storage upload page accepts files larger than Spring's 1 MB default)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Datasource Configuration (MySQL/MariaDB via XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/gobrodb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Flyway Configuration
spring.flyway.enabled=false

# Application Security & JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

# Spring Security OAuth2 Clients
spring.security.oauth2.client.registration.google.client-id=dummy-google-client-id
spring.security.oauth2.client.registration.google.client-secret=dummy-google-client-secret
spring.security.oauth2.client.registration.google.scope=email,profile

spring.security.oauth2.client.registration.facebook.client-id=dummy-facebook-client-id
spring.security.oauth2.client.registration.facebook.client-secret=dummy-facebook-client-secret
spring.security.oauth2.client.registration.facebook.scope=email,public_profile

# Application Storage Configuration
app.storage.provider=minio
app.storage.endpoint=http://127.0.0.1:9000
app.storage.region=us-east-1
app.storage.access-key=minioadmin
app.storage.secret-key=minioadmin
app.storage.bucket=gobro-videos
app.storage.path-style-access=true
app.storage.public-base-url=http://127.0.0.1:9000/gobro-videos
app.storage.presigned-url-expiration-minutes=15

# Payment Providers Configuration
app.payment.d17.base-url=https://api.d17.tn
app.payment.d17.api-key=dummy-d17-key
app.payment.konnect.base-url=https://api.konnect.network
app.payment.konnect.api-key=dummy-konnect-key
app.payment.konnect.wallet-id=dummy-wallet-id
app.payment.flouci.base-url=https://api.flouci.com
app.payment.flouci.app-token=dummy-flouci-token
app.payment.flouci.app-secret=dummy-flouci-secret

# OAuth2 & Platform Defaults
app.oauth2.default-role=ETUDIANT
app.oauth2.redirect-uri=http://localhost:4200/oauth2/redirect
app.name=GoBro Platform
